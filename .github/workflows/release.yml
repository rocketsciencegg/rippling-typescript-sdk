name: Release
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'What changed in the API spec'
        required: true
        type: string

permissions:
  contents: read

# workflow_dispatch may write the default-branch cache. This job tags and
# publishes, so it neither restores nor saves.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#cache-mode
cache-mode: none

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag push later in this job needs the checkout credential helper.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: .node-version
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc
      - name: Get version
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          body: ${{ github.event.inputs.release_notes }}
          generate_release_notes: true
